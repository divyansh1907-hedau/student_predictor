<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPredict AI - Student Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-indigo-400">🎓 Create Account</h1>
            <p class="text-xs text-gray-400">Register as a New Student on EduPredict AI</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl text-xs bg-rose-950/80 border border-rose-800 text-rose-300">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required 
                       class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. rahul_s">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Email Address</label>
                <input type="email" name="email" required 
                       class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="rahul@university.edu">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required 
                       class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-700">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-400 mb-1">Attendance %</label>
                    <input type="number" step="0.1" name="attendance" value="75" min="0" max="100" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white text-xs outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-400 mb-1">Midterm Score %</label>
                    <input type="number" step="0.1" name="midterm" value="60" min="0" max="100" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white text-xs outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">
                Register Student Account 🚀
            </button>
        </form>

        <div class="text-center text-xs text-gray-400 pt-2 border-t border-gray-700">
            Already have an account? <a href="/login" class="text-indigo-400 hover:underline font-bold">Log In here</a>
        </div>

    </div>
</body>
</html>
